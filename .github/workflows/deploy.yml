name: Build and Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go binary for Linux
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o main .

      - name: Deploy binary and config via Native SSH/SCP
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $PORT -H $HOST >> ~/.ssh/known_hosts

          # Создаем директории на VPS если не существуют
          ssh -p $PORT $USER@$HOST "mkdir -p /opt/option-quant-ai/backend"

          # Синхронизируем всю папку backend (включая static, quant, alor, agent, main.go, Dockerfile)
          rsync -avz -e "ssh -p $PORT -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" backend/ $USER@$HOST:/opt/option-quant-ai/backend/
          
          # Копируем docker-compose.yml
          scp -P $PORT -i ~/.ssh/id_rsa docker-compose.yml $USER@$HOST:/opt/option-quant-ai/docker-compose.yml

          # Перезапустим Docker Compose с полным пересбором
          ssh -p $PORT -i ~/.ssh/id_rsa $USER@$HOST "cd /opt/option-quant-ai && docker compose down --remove-orphans || true && docker compose up --build --force-recreate -d"