name: Build and Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # Module lives in backend/, not repo root.
          cache-dependency-path: backend/go.sum

      - name: Build Go binary for Linux
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o main .

      - name: Deploy binary and config via Native SSH/SCP
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $PORT -H $HOST >> ~/.ssh/known_hosts

          # Доставка через git вместо scp: частичный scp при обрыве оставлял
          # смешанное дерево (файлы разных коммитов), плюс сыпались
          # Permission denied. Репозиторий на VPS уже есть.
          # Перезапустим Docker Compose с полным пересбором
          ssh -p $PORT -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $USER@$HOST "cd /opt/option-quant-ai && git fetch origin && git reset --hard origin/main && git log --oneline -1 && (docker compose down --remove-orphans || true) && docker compose up --build --force-recreate -d"