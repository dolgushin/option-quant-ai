name: Build and Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go binary for Linux
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o main .

      - name: Deploy binary and config via Native SSH/SCP
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $PORT -H $HOST >> ~/.ssh/known_hosts

          # Создаем директорию на VPS если не существует
          ssh -p $PORT $USER@$HOST "mkdir -p /opt/option-quant-ai/backend"

          # Скопируем бинарник, Dockerfile и docker-compose напрямую
          scp -P $PORT backend/main $USER@$HOST:/opt/option-quant-ai/backend/main
          scp -P $PORT backend/Dockerfile $USER@$HOST:/opt/option-quant-ai/backend/Dockerfile
          scp -P $PORT docker-compose.yml $USER@$HOST:/opt/option-quant-ai/docker-compose.yml

          # Перезапустим Docker Compose
          ssh -p $PORT $USER@$HOST "cd /opt/option-quant-ai && docker compose down --remove-orphans || true && docker compose up --build -d"