name: Build and Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          outputs: type=docker,dest=/tmp/option-quant-ai-backend.tar
          tags: option-quant-ai-backend:latest

      - name: Copy image artifact to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "/tmp/option-quant-ai-backend.tar"
          target: "/tmp/"
          rm: true

      - name: Load image and restart service via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 5m
          script: |
            cd /opt/option-quant-ai
            git config --global --add safe.directory /opt/option-quant-ai
            git fetch --all
            git reset --hard origin/main
            docker load -i /tmp/option-quant-ai-backend.tar
            rm -f /tmp/option-quant-ai-backend.tar
            docker compose up -d