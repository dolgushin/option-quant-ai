services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: option-quant-app
    restart: always
    environment:
      - PORT=9000
      - DATA_DIR=/app/data
    volumes:
      - quant_data:/app/data
    networks:
      - proxy

volumes:
  quant_data:

networks:
  proxy:
    external: true